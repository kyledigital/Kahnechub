<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Kahnec Hub sharing card artwork</title>
  <style>
    @font-face { font-family:Outfit; src:url('../assets/fonts/outfit-latin.woff2') format('woff2'); font-weight:100 900; }
    * { box-sizing:border-box; }
    body { width:1200px; height:630px; margin:0; font-family:Outfit,Arial,sans-serif; color:#342352; background:#fcf7ee; }
    .card { width:1200px; height:630px; padding:54px 58px 46px; position:relative; overflow:hidden; }
    .logo { width:246px; height:79px; object-fit:cover; object-position:center; }
    .eyebrow { margin:28px 0 18px; font-size:20px; font-weight:500; letter-spacing:2px; color:#665180; }
    h1 { width:770px; margin:0; font-size:76px; font-weight:550; line-height:1.08; letter-spacing:-3px; }
    h1 span { display:block; color:#574089; }
    .services { margin:32px 0 0; font-size:25px; color:#5b4d6c; }
    .address { position:absolute; bottom:45px; left:58px; margin:0; font-size:24px; font-weight:500; }
    .person { position:absolute; right:58px; top:57px; width:272px; height:504px; margin:0; padding:24px; background:#342352; border-radius:110px 110px 18px 18px; color:#fcf7ee; }
    .portrait { width:224px; height:323px; display:block; object-fit:cover; object-position:50% 28%; border:3px solid #f3d184; border-radius:90px 90px 8px 8px; }
    .person figcaption { padding-top:25px; }
    .person strong { display:block; font-size:25px; font-weight:500; }
    .person span { display:block; margin-top:9px; font-size:18px; color:#f3d184; line-height:1.4; }
    .rule { position:absolute; left:58px; bottom:94px; width:710px; height:2px; background:#d8d0dd; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/images/kahnec-logo-full-res.png" alt="Kahnec Hub">
    <p class="eyebrow">YOUR DIGITAL MARKETING PARTNER</p>
    <h1>Your marketing<br>team, <span>without the overhead.</span></h1>
    <p class="services">Strategy. Content. Advertising. Performance.</p>
    <div class="rule"></div>
    <p class="address">kahnechub.com</p>
    <figure class="person">
      <img class="portrait" src="../assets/images/kyle-hector-portrait.webp" alt="Kyle Hector">
      <figcaption><strong>Work directly<br>with Kyle Hector.</strong><span>DMI-certified<br>digital marketer</span></figcaption>
    </figure>
  </main>
</body>
</html>
